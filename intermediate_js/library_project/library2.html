<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/intermediate_js/library_project/library2.css"
    />
    <title>Library 2</title>
  </head>
  <body>
    <!-- Header for add books -->
    <div class="header">
      <button class="add-btn"><i class="fa fa-plus"></i>Add Book</button>
    </div>

    <!-- Container for the main content -->
    <div class="container">
      <!-- This is where the main content is going -->
    </div>

    <div class="form-container">
      <form action="" class="form">
        <div class="input-container">
          <div><label for="title">Title</label></div>
          <input type="text" class="title" id="title" />
        </div>
        <div class="input-container">
          <div><label for="author">Author</label></div>
          <input type="text" class="author" id="author" />
        </div>
        <div class="input-container">
          <div><label for="date">Date</label></div>
          <input type="date" class="date" id="date" />
        </div>
        <button type="submit" class="submit-btn">Submit</button>
        <button type="reset" class="reset-btn">Cancel</button>
      </form>
    </div>
    <script
      src="https://kit.fontawesome.com/9d60df7450.js"
      crossorigin="anonymous"
    ></script>
    <script src="/intermediate_js/library_project/library.js"></script>
  </body>
</html>
