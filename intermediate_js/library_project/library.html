<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link
      rel="stylesheet"
      href="/intermediate_js/library_project/library.css"
    />
  </head>
  <body>
    <nav class="navigation">
      <button class="add-btn"><i class="fa fa-plus"></i> Add</button>
    </nav>
    <div class="container"></div>

    <div class="form-container">
      <form action="" class="form">
        <div class="field">
          <label for="title">Title:</label>
          <input type="text" class="title" id="title" required />
        </div>
        <div class="field">
          <label for="name">Name:</label>
          <input type="text" class="name" id="name" required />
        </div>
        <div class="field">
          <label for="author">Author:</label>
          <input type="author" class="author" id="author" required />
        </div>
        <div class="field">
          <label for="date">Date:</label>
          <input type="date" class="date" id="date" required />
        </div>
        <div class="button">
          <button type="submit" class="submit-btn">Submit</button>
          <button type="submit" class="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

    <script src="/intermediate_js/library_project/library.js"></script>
    <script
      src="https://kit.fontawesome.com/9d60df7450.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
