<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/intermediate_js/tic-tac-toe/style.css" />
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <div class="container">
      <h1>Tic Tac Toe</h1>
      <div class="playerContainer">
        <label for="name">Player name</label>
        <input type="text" class="name" id="name" />
        <button class="start">start</button>
      </div>
      <div class="cellContainer">
        <div cellAttribute="0" class="cell"></div>
        <div cellAttribute="1" class="cell"></div>
        <div cellAttribute="2" class="cell"></div>
        <div cellAttribute="3" class="cell"></div>
        <div cellAttribute="4" class="cell"></div>
        <div cellAttribute="5" class="cell"></div>
        <div cellAttribute="6" class="cell"></div>
        <div cellAttribute="7" class="cell"></div>
        <div cellAttribute="8" class="cell"></div>
      </div>
      <h2 class="result"></h2>
      <button class="restart">restart</button>
    </div>
    <script src="/intermediate_js/tic-tac-toe/script.js"></script>
  </body>
</html>
